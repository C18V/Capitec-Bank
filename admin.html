<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalOne - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f2f2f2; max-width: 430px; margin: 0 auto; min-height: 100vh; }
        .header-red { background: #cc0000; color: white; padding: 40px 20px; text-align: center; }
        .header-blue { background: #0077c8; color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: 600; }
        .card { background: white; border-radius: 8px; margin: 20px; padding: 20px; }
        .btn-primary { width: 100%; padding: 15px; background: #0077c8; color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; display: block; text-align: center; text-decoration: none; margin-top: 10px; }
        
        .admin-user { border-bottom: 1px solid #eee; padding: 15px 0; }
        .admin-input { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .admin-input input { width: 80px; border: 1px solid #ddd; padding: 8px; border-radius: 4px; }
        .admin-input button { background: #0077c8; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .chat-box { border-bottom: 1px solid #eee; padding: 10px 0; }
        .refresh-btn { background: #0077c8; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="lockScreen">
        <div class="header-red"><h1>Admin</h1></div>
        <div class="card">
            <label style="font-size: 14px; font-weight: bold;">Admin Password</label>
            <input type="password" id="adminPass" placeholder="Enter password" style="width: 100%; border: 1px solid #ddd; padding: 10px; border-radius: 4px; margin-top: 10px;">
            <a href="#" class="btn-primary" onclick="checkAdminPass(event)">Unlock</a>
            <a href="index.html" class="btn-primary" style="background: white; color: #0077c8; border: 1px solid #0077c8;">Back</a>
        </div>
    </div>

    <div id="adminPanel" style="display: none;">
        <div class="header-blue">Admin Panel <a href="index.html" style="color:white; text-decoration: none; float:right; font-size: 14px;">Logout</a></div>
        
        <div class="card">
            <h2 style="color:#0077c8; margin-bottom: 20px;">User Management</h2>
            <div id="userList"></div>
        </div>
        
        <div class="card">
            <h2 style="color:#0077c8; margin-bottom: 20px;">Customer Service Inbox</h2>
            <button class="refresh-btn" onclick="loadAdminChats()">🔄 Refresh Chats</button>
            <div id="chatInbox"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDD22uL4h-3_zfZ9WDziUeUmXZuyuwXBIs",
            authDomain: "globalone-5384a.firebaseapp.com",
            projectId: "globalone-5384a",
            storageBucket: "globalone-5384a.firebasestorage.app",
            messagingSenderId: "74415409889",
            appId: "1:74415409889:web:ad88ae947752108eb445a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_PASSWORD = "admin123";
        let allUsers = [];

        window.checkAdminPass = function(e) {
            e.preventDefault();
            if (document.getElementById('adminPass').value === ADMIN_PASSWORD) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadAdmin();
                
                // REAL-TIME LISTENER: Automatically updates admin panel whenever chat changes!
                onSnapshot(collection(db, "users"), (snapshot) => {
                    allUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    loadAdminChats();
                });
            } else { alert("Incorrect password!"); }
        };

        async function loadAdmin() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                allUsers = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                const list = document.getElementById('userList');
                if (allUsers.length === 0) {
                    list.innerHTML = '<p style="color:#888;">No users yet.</p>';
                } else {
                    list.innerHTML = allUsers.map((user, index) => `
                        <div class="admin-user">
                            <strong>${user.name}</strong> <br>
                            <small style="color:#888;">${user.email}</small>
                            <div class="admin-input">
                                <span style="font-size: 12px;">Main:</span>
                                <input type="number" id="main_${index}" value="${user.mainBalance}">
                                <span style="font-size: 12px;">Savings:</span>
                                <input type="number" id="sav_${index}" value="${user.savingsBalance}">
                                <span style="font-size: 12px;">Credit:</span>
                                <input type="number" id="cred_${index}" value="${user.creditBalance}">
                                <button onclick="updateUser(${index})">Save</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error("Error loading admin:", error);
                alert("Error loading data.");
            }
        }

        window.updateUser = async function(index) {
            const main = parseFloat(document.getElementById(`main_${index}`).value);
            const savings = parseFloat(document.getElementById(`sav_${index}`).value);
            const credit = parseFloat(document.getElementById(`cred_${index}`).value);

            try {
                const docRef = doc(db, "users", allUsers[index].id);
                await updateDoc(docRef, { mainBalance: main, savingsBalance: savings, creditBalance: credit });
                alert("User updated!"); 
                loadAdmin();
            } catch (error) {
                console.error("Error updating user:", error);
                alert("Error updating user.");
            }
        };

        window.loadAdminChats = async function() {
            try {
                const inbox = document.getElementById('chatInbox');
                const usersWithChats = allUsers.filter(user => user.chatHistory && user.chatHistory.length > 0);
                
                if (usersWithChats.length === 0) {
                    inbox.innerHTML = '<p style="color:#888;">No chats yet.</p>';
                } else {
                    inbox.innerHTML = allUsers.map((user, index) => {
                        if(user.chatHistory && user.chatHistory.length > 0) {
                            return `
                            <div class="chat-box">
                                <strong>${user.name}</strong>
                                ${user.chatHistory.map(m => 
                                    `<div style="margin: 5px 0; text-align: ${m.from === 'admin' ? 'right' : 'left'};">
                                        <span style="background: ${m.from === 'admin' ? '#0077c8' : '#eee'}; color: ${m.from === 'admin' ? 'white' : '#333'}; padding: 5px 10px; border-radius: 8px; font-size: 13px;">${m.text}</span>
                                    </div>`).join('')}
                                <div class="admin-input">
                                    <input type="text" id="adminmsg_${index}" placeholder="Reply..." style="flex: 1; width: auto;">
                                    <button onclick="replyUser(${index})" style="background:#cc0000;">Send</button>
                                </div>
                            </div>`;
                        }
                    }).join('');
                }
            } catch (error) {
                console.error("Error loading chats:", error);
            }
        };

        window.replyUser = async function(index) {
            const reply = document.getElementById(`adminmsg_${index}`).value.trim();
            if(!reply) return;

            try {
                const docRef = doc(db, "users", allUsers[index].id);
                const newChatHistory = [...allUsers[index].chatHistory, { from: 'admin', text: reply }];
                await updateDoc(docRef, { chatHistory: newChatHistory });
                
                document.getElementById(`adminmsg_${index}`).value = '';
                loadAdminChats();
            } catch (error) {
                console.error("Error replying:", error);
            }
        };
    </script>
</body>
</html>
